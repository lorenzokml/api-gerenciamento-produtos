
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Produtos</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>📦 Loja de Produtos</h1>
        <p>Sistema de gerenciamento de estoque</p>
    </header>

    <main>
        <section>
            <h2>Cadastrar produto</h2>

            <form id="produtoForm">
                <input type="text" id="nome" placeholder="Nome do produto" required>
                <input type="text" id="descricao" placeholder="Descrição">

                <input type="number" id="preco" placeholder="Preço" min="0.01" step="0.01" required>

                <input type="number" id="quantidade" placeholder="Quantidade em estoque" min="0" step="1" required>

                <input type="text" id="categoria" placeholder="Categoria" required>

                <button type="submit">Cadastrar produto</button>
            </form>
        </section>

        <section>
            <h2>Produtos cadastrados</h2>

            <input type="text" id="pesquisa" placeholder="Pesquisar produto...">

            <div id="listaProdutos">
                Carregando produtos...
            </div>
        </section>
    </main>

    <footer>
        Projeto API de Gerenciamento de Produtos
    </footer>

</body>
</html>
